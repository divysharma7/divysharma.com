<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Helvetica Neue', sans-serif">
  <rect width="1280" height="720" fill="#F4EFE6"/>

  <!-- Subtitle (mono) -->
  <text x="96" y="280" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="18" font-weight="500" fill="#1A1A1A" letter-spacing="0.04em">MEETINGS THAT EARN THEIR TIME</text>

  <!-- Accent rule -->
  <rect x="96" y="300" width="64" height="12" rx="1" fill="#E8765A"/>

  <!-- Title -->
  <text x="96" y="380" font-size="82" font-weight="700" fill="#1A1A1A" letter-spacing="-0.02em">Stakeholder Reviews</text>
  <text x="96" y="470" font-size="82" font-weight="700" fill="#1A1A1A" letter-spacing="-0.02em">That Work</text>

  <!-- Abstract figures on right side -->
  <!-- Presenter figure -->
  <circle cx="980" cy="340" r="18" fill="#1A1A1A" opacity="0.8"/>
  <rect x="968" y="365" width="24" height="60" rx="12" fill="#1A1A1A" opacity="0.8"/>

  <!-- Display behind presenter -->
  <rect x="880" y="200" width="220" height="140" rx="4" fill="none" stroke="#1A1A1A" stroke-width="2" opacity="0.3"/>
  <!-- Three abstract panels in display -->
  <rect x="892" y="216" width="60" height="108" rx="2" fill="#E8765A" opacity="0.3"/>
  <rect x="960" y="216" width="60" height="108" rx="2" fill="#1A1A1A" opacity="0.12"/>
  <rect x="1028" y="216" width="60" height="108" rx="2" fill="#1A1A1A" opacity="0.08"/>

  <!-- Audience figures (varied postures) -->
  <!-- Leaning in -->
  <circle cx="900" cy="500" r="14" fill="#1A1A1A" opacity="0.5"/>
  <rect x="890" y="520" width="20" height="44" rx="10" fill="#1A1A1A" opacity="0.5" transform="rotate(-8 900 540)"/>

  <!-- Attentive -->
  <circle cx="970" cy="510" r="14" fill="#1A1A1A" opacity="0.4"/>
  <rect x="960" y="530" width="20" height="44" rx="10" fill="#1A1A1A" opacity="0.4"/>

  <!-- Arms crossed -->
  <circle cx="1040" cy="505" r="14" fill="#1A1A1A" opacity="0.35"/>
  <rect x="1030" y="525" width="20" height="44" rx="10" fill="#1A1A1A" opacity="0.35"/>

  <!-- Looking away -->
  <circle cx="1110" cy="515" r="14" fill="#1A1A1A" opacity="0.25"/>
  <rect x="1100" y="535" width="20" height="44" rx="10" fill="#1A1A1A" opacity="0.25"/>
</svg>
