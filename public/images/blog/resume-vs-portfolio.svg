<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="360" fill="#fafafa" rx="12"/>

  <!-- Left panel: Resume -->
  <g transform="translate(60, 40)">
    <rect width="300" height="280" rx="8" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>
    <rect width="300" height="280" rx="8" fill="#1A1A1A" opacity="0.02"/>

    <!-- Header -->
    <text x="150" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#3f3f46" letter-spacing="0.03em">RESUME</text>
    <line x1="20" y1="48" x2="280" y2="48" stroke="#e4e4e7" stroke-width="1"/>

    <!-- "I worked on this" list -->
    <text x="24" y="76" font-size="11" font-weight="600" fill="#71717a">Education</text>
    <rect x="24" y="84" width="180" height="5" rx="2" fill="#1A1A1A" opacity="0.12"/>
    <rect x="24" y="94" width="140" height="5" rx="2" fill="#1A1A1A" opacity="0.08"/>

    <text x="24" y="122" font-size="11" font-weight="600" fill="#71717a">Job Title</text>
    <rect x="24" y="130" width="200" height="5" rx="2" fill="#1A1A1A" opacity="0.12"/>
    <rect x="24" y="140" width="160" height="5" rx="2" fill="#1A1A1A" opacity="0.08"/>

    <text x="24" y="168" font-size="11" font-weight="600" fill="#71717a">Responsibilities</text>
    <!-- Bullet points -->
    <circle cx="30" cy="180" r="2" fill="#1A1A1A" opacity="0.3"/>
    <rect x="38" y="178" width="200" height="5" rx="2" fill="#1A1A1A" opacity="0.1"/>
    <circle cx="30" cy="194" r="2" fill="#1A1A1A" opacity="0.3"/>
    <rect x="38" y="192" width="180" height="5" rx="2" fill="#1A1A1A" opacity="0.1"/>
    <circle cx="30" cy="208" r="2" fill="#1A1A1A" opacity="0.3"/>
    <rect x="38" y="206" width="210" height="5" rx="2" fill="#1A1A1A" opacity="0.1"/>
    <circle cx="30" cy="222" r="2" fill="#1A1A1A" opacity="0.3"/>
    <rect x="38" y="220" width="170" height="5" rx="2" fill="#1A1A1A" opacity="0.1"/>

    <!-- Bottom label -->
    <text x="150" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#a1a1aa" font-style="italic">"I worked on this."</text>
  </g>

  <!-- Arrow between panels -->
  <g transform="translate(380, 170)">
    <text x="20" y="-2" text-anchor="middle" font-size="16" fill="#a1a1aa">vs</text>
  </g>

  <!-- Right panel: Portfolio -->
  <g transform="translate(440, 40)">
    <rect width="300" height="280" rx="8" fill="none" stroke="#E8765A" stroke-width="2"/>
    <rect width="300" height="280" rx="8" fill="#E8765A" opacity="0.04"/>

    <!-- Header -->
    <text x="150" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#E8765A" letter-spacing="0.03em">PORTFOLIO</text>
    <line x1="20" y1="48" x2="280" y2="48" stroke="#E8765A" stroke-width="1" opacity="0.3"/>

    <!-- Project with visual + thinking -->
    <rect x="24" y="64" width="80" height="55" rx="4" fill="#E8765A" opacity="0.15"/>
    <text x="116" y="78" font-size="11" font-weight="600" fill="#3f3f46">The Problem</text>
    <rect x="116" y="84" width="150" height="5" rx="2" fill="#1A1A1A" opacity="0.15"/>
    <text x="116" y="104" font-size="11" font-weight="600" fill="#3f3f46">My Approach</text>
    <rect x="116" y="110" width="140" height="5" rx="2" fill="#1A1A1A" opacity="0.15"/>

    <!-- Trade-offs section -->
    <text x="24" y="142" font-size="11" font-weight="600" fill="#3f3f46">Trade-offs I Considered</text>
    <rect x="24" y="150" width="250" height="5" rx="2" fill="#E8765A" opacity="0.15"/>
    <rect x="24" y="160" width="220" height="5" rx="2" fill="#E8765A" opacity="0.1"/>

    <!-- Decision section -->
    <text x="24" y="188" font-size="11" font-weight="600" fill="#3f3f46">Why I Chose This</text>
    <rect x="24" y="196" width="240" height="5" rx="2" fill="#E8765A" opacity="0.15"/>
    <rect x="24" y="206" width="200" height="5" rx="2" fill="#E8765A" opacity="0.1"/>

    <!-- What I learned -->
    <text x="24" y="234" font-size="11" font-weight="600" fill="#3f3f46">What I Learned</text>
    <rect x="24" y="242" width="230" height="5" rx="2" fill="#E8765A" opacity="0.15"/>
    <rect x="24" y="252" width="190" height="5" rx="2" fill="#E8765A" opacity="0.1"/>

    <!-- Bottom label -->
    <text x="150" y="278" text-anchor="middle" font-size="12" font-weight="500" fill="#E8765A" font-style="italic">"This is how I think."</text>
  </g>
</svg>