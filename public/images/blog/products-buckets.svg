<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="420" fill="#f9f7f4" rx="12"/>

  <!-- BUCKET 1: GAMECHANGERS (accent color, prominent) -->
  <!-- Bucket shape -->
  <path d="M60 180 L80 380 L240 380 L260 180 Z" fill="#E8765A" opacity="0.08" stroke="#E8765A" stroke-width="2"/>
  <text x="160" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#E8765A">GAMECHANGERS</text>
  <text x="160" y="186" text-anchor="middle" font-size="10" fill="#E8765A">1-3 features max</text>

  <!-- Few cards with stars (1-2 cards) -->
  <rect x="95" y="220" width="130" height="40" rx="5" fill="#fff" stroke="#E8765A" stroke-width="1.5" transform="rotate(-2, 160, 240)"/>
  <text x="115" y="237" font-size="14" fill="#E8765A">&#9733;</text>
  <text x="132" y="237" font-size="11" fill="#2a2a2a" font-weight="500">Multi-touch</text>
  <text x="132" y="252" font-size="9" fill="#71717a">the reason to buy</text>

  <rect x="100" y="280" width="120" height="38" rx="5" fill="#fff" stroke="#E8765A" stroke-width="1.5" transform="rotate(1, 160, 299)"/>
  <text x="118" y="296" font-size="14" fill="#E8765A">&#9733;</text>
  <text x="135" y="296" font-size="11" fill="#2a2a2a" font-weight="500">Visual voicemail</text>
  <text x="135" y="310" font-size="9" fill="#71717a">nobody else had it</text>

  <!-- Sparkle decorations -->
  <text x="80" y="215" font-size="10" fill="#E8765A">&#10022;</text>
  <text x="235" y="270" font-size="8" fill="#E8765A">&#10022;</text>

  <!-- BUCKET 2: SHOWSTOPPERS (neutral, packed full) -->
  <path d="M290 180 L310 380 L490 380 L510 180 Z" fill="#e8e4df" opacity="0.3" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="400" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#2a2a2a">SHOWSTOPPERS</text>
  <text x="400" y="186" text-anchor="middle" font-size="10" fill="#71717a">dozens of features</text>

  <!-- Many packed cards with checkmarks -->
  <rect x="320" y="200" width="160" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="330" y="215" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="345" y="215" font-size="9" fill="#3f3f46">Voice calls</text>

  <rect x="322" y="226" width="156" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="332" y="241" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="347" y="241" font-size="9" fill="#3f3f46">SMS messaging</text>

  <rect x="318" y="252" width="164" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="328" y="267" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="343" y="267" font-size="9" fill="#3f3f46">Contact list</text>

  <rect x="324" y="278" width="152" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="334" y="293" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="349" y="293" font-size="9" fill="#3f3f46">Calendar</text>

  <rect x="320" y="304" width="160" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="330" y="319" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="345" y="319" font-size="9" fill="#3f3f46">Calculator</text>

  <rect x="316" y="330" width="168" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="326" y="345" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="341" y="345" font-size="9" fill="#3f3f46">Web browser</text>

  <rect x="322" y="356" width="156" height="22" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <text x="332" y="371" font-size="10" fill="#22c55e">&#10003;</text>
  <text x="347" y="371" font-size="9" fill="#3f3f46">Volume buttons</text>

  <!-- BUCKET 3: DISTRACTIONS (faded, small) -->
  <path d="M550 200 L565 380 L695 380 L710 200 Z" fill="#eee" opacity="0.2" stroke="#ccc" stroke-width="1.2"/>
  <text x="630" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#aaa">DISTRACTIONS</text>
  <text x="630" y="208" text-anchor="middle" font-size="10" fill="#ccc">almost none</text>

  <!-- 1-2 faded cards with X marks -->
  <rect x="572" y="240" width="116" height="35" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" opacity="0.5"/>
  <text x="582" y="260" font-size="9" fill="#aaa">Copy-paste</text>
  <line x1="575" y1="244" x2="685" y2="271" stroke="#E8765A" stroke-width="1.2" opacity="0.4"/>
  <line x1="685" y1="244" x2="575" y2="271" stroke="#E8765A" stroke-width="1.2" opacity="0.4"/>

  <rect x="578" y="290" width="104" height="35" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" opacity="0.5"/>
  <text x="588" y="310" font-size="9" fill="#aaa">MMS video</text>
  <line x1="581" y1="294" x2="679" y2="321" stroke="#E8765A" stroke-width="1.2" opacity="0.4"/>
  <line x1="679" y1="294" x2="581" y2="321" stroke="#E8765A" stroke-width="1.2" opacity="0.4"/>

  <!-- Sorting hand (top center) -->
  <path d="M380 60 C395 45, 420 42, 430 52 L445 70 C448 75, 446 82, 440 84 L415 90 C400 94, 385 88, 380 75 Z" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M430 52 L440 42 C448 36, 456 40, 455 48 L445 70" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Card being sorted -->
  <rect x="440" y="75" width="80" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1.2" transform="rotate(10, 480, 92)"/>
  <text x="460" y="92" font-size="9" fill="#2a2a2a" transform="rotate(10, 480, 92)">Feature?</text>

  <!-- Sorting arrows -->
  <path d="M420 110 C380 130, 250 140, 160 170" fill="none" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="162,168 155,175 168,174" fill="#2a2a2a"/>

  <path d="M450 110 C440 130, 420 150, 400 170" fill="none" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="401,168 396,176 406,174" fill="#2a2a2a"/>

  <path d="M490 105 C540 125, 590 145, 630 175" fill="none" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="628,173 635,180 634,170" fill="#2a2a2a"/>

  <!-- Bottom summary -->
  <text x="400" y="408" text-anchor="middle" font-size="12" fill="#2a2a2a" font-weight="500" font-style="italic">Few gamechangers. Many showstoppers. Almost no distractions.</text>
</svg>
