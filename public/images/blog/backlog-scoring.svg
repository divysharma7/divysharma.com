<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="420" fill="#f9f7f4" rx="12"/>

  <!-- Three scoring bars -->
  <!-- Bar 1: Importance to Business -->
  <text x="80" y="50" font-size="12" font-weight="600" fill="#2a2a2a">Importance to Business</text>
  <rect x="80" y="58" width="200" height="24" rx="4" fill="#eee" stroke="#2a2a2a" stroke-width="1"/>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="100" y="75">1</text><text x="140" y="75">2</text><text x="180" y="75">3</text><text x="220" y="75">4</text><text x="260" y="75">5</text>
  </g>
  <line x1="120" y1="58" x2="120" y2="82" stroke="#ccc" stroke-width="0.5"/>
  <line x1="160" y1="58" x2="160" y2="82" stroke="#ccc" stroke-width="0.5"/>
  <line x1="200" y1="58" x2="200" y2="82" stroke="#ccc" stroke-width="0.5"/>
  <line x1="240" y1="58" x2="240" y2="82" stroke="#ccc" stroke-width="0.5"/>

  <!-- Bar 2: Frequency of Use -->
  <text x="80" y="110" font-size="12" font-weight="600" fill="#2a2a2a">Frequency of Use</text>
  <rect x="80" y="118" width="200" height="24" rx="4" fill="#eee" stroke="#2a2a2a" stroke-width="1"/>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="100" y="135">1</text><text x="140" y="135">2</text><text x="180" y="135">3</text><text x="220" y="135">4</text><text x="260" y="135">5</text>
  </g>
  <line x1="120" y1="118" x2="120" y2="142" stroke="#ccc" stroke-width="0.5"/>
  <line x1="160" y1="118" x2="160" y2="142" stroke="#ccc" stroke-width="0.5"/>
  <line x1="200" y1="118" x2="200" y2="142" stroke="#ccc" stroke-width="0.5"/>
  <line x1="240" y1="118" x2="240" y2="142" stroke="#ccc" stroke-width="0.5"/>

  <!-- Bar 3: Ease of Development -->
  <text x="80" y="170" font-size="12" font-weight="600" fill="#2a2a2a">Ease of Development</text>
  <rect x="80" y="178" width="200" height="24" rx="4" fill="#eee" stroke="#2a2a2a" stroke-width="1"/>
  <g font-size="10" fill="#71717a" text-anchor="middle">
    <text x="100" y="195">1</text><text x="140" y="195">2</text><text x="180" y="195">3</text><text x="220" y="195">4</text><text x="260" y="195">5</text>
  </g>
  <line x1="120" y1="178" x2="120" y2="202" stroke="#ccc" stroke-width="0.5"/>
  <line x1="160" y1="178" x2="160" y2="202" stroke="#ccc" stroke-width="0.5"/>
  <line x1="200" y1="178" x2="200" y2="202" stroke="#ccc" stroke-width="0.5"/>
  <line x1="240" y1="178" x2="240" y2="202" stroke="#ccc" stroke-width="0.5"/>

  <!-- Example Card A: HIGH SCORE (Quick Win) -->
  <rect x="400" y="30" width="360" height="170" rx="8" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="400" y="30" width="360" height="36" rx="8" fill="#E8765A"/>
  <rect x="400" y="50" width="360" height="16" fill="#E8765A"/>
  <text x="420" y="54" font-size="13" font-weight="700" fill="#fff">&#9733; QUICK WIN — DO NOW</text>

  <text x="420" y="88" font-size="12" fill="#2a2a2a" font-weight="500">"Add date range filter to search"</text>

  <text x="420" y="116" font-size="11" fill="#71717a">Importance to Business</text>
  <text x="620" y="116" font-size="14" font-weight="700" fill="#2a2a2a">5</text>
  <rect x="420" y="122" width="180" height="4" rx="2" fill="#eee"/>
  <rect x="420" y="122" width="180" height="4" rx="2" fill="#E8765A"/>

  <text x="420" y="142" font-size="11" fill="#71717a">Frequency of Use</text>
  <text x="620" y="142" font-size="14" font-weight="700" fill="#2a2a2a">4</text>
  <rect x="420" y="148" width="180" height="4" rx="2" fill="#eee"/>
  <rect x="420" y="148" width="144" height="4" rx="2" fill="#E8765A"/>

  <text x="420" y="168" font-size="11" fill="#71717a">Ease of Development</text>
  <text x="620" y="168" font-size="14" font-weight="700" fill="#2a2a2a">4</text>
  <rect x="420" y="174" width="180" height="4" rx="2" fill="#eee"/>
  <rect x="420" y="174" width="144" height="4" rx="2" fill="#E8765A"/>

  <text x="660" y="116" font-size="11" fill="#71717a" text-anchor="start">Total:</text>
  <text x="700" y="116" font-size="22" font-weight="800" fill="#E8765A">13</text>

  <!-- Example Card B: LOW SCORE (Cut) -->
  <rect x="400" y="225" width="360" height="170" rx="8" fill="#fff" stroke="#2a2a2a" stroke-width="1.5" opacity="0.6"/>

  <text x="420" y="254" font-size="12" fill="#2a2a2a" font-weight="500" opacity="0.6">"NLP-based search autocomplete"</text>

  <text x="420" y="282" font-size="11" fill="#71717a" opacity="0.6">Importance to Business</text>
  <text x="620" y="282" font-size="14" font-weight="700" fill="#2a2a2a" opacity="0.6">1</text>
  <rect x="420" y="288" width="180" height="4" rx="2" fill="#eee"/>
  <rect x="420" y="288" width="36" height="4" rx="2" fill="#ccc"/>

  <text x="420" y="308" font-size="11" fill="#71717a" opacity="0.6">Frequency of Use</text>
  <text x="620" y="308" font-size="14" font-weight="700" fill="#2a2a2a" opacity="0.6">1</text>
  <rect x="420" y="314" width="180" height="4" rx="2" fill="#eee"/>
  <rect x="420" y="314" width="36" height="4" rx="2" fill="#ccc"/>

  <text x="420" y="334" font-size="11" fill="#71717a" opacity="0.6">Ease of Development</text>
  <text x="620" y="334" font-size="14" font-weight="700" fill="#2a2a2a" opacity="0.6">1</text>
  <rect x="420" y="340" width="180" height="4" rx="2" fill="#eee"/>
  <rect x="420" y="340" width="36" height="4" rx="2" fill="#ccc"/>

  <text x="660" y="282" font-size="11" fill="#71717a" text-anchor="start" opacity="0.6">Total:</text>
  <text x="700" y="282" font-size="22" font-weight="800" fill="#a1a1aa">3</text>

  <!-- CUT label -->
  <line x1="410" y1="232" x2="750" y2="388" stroke="#E8765A" stroke-width="2" opacity="0.4"/>
  <line x1="750" y1="232" x2="410" y2="388" stroke="#E8765A" stroke-width="2" opacity="0.4"/>
  <rect x="540" y="230" width="80" height="28" rx="4" fill="#f9f7f4"/>
  <text x="580" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#E8765A" opacity="0.7">CUT</text>

  <!-- Legend -->
  <text x="80" y="260" font-size="12" fill="#2a2a2a" font-weight="600">Score bands:</text>
  <text x="80" y="282" font-size="11" fill="#71717a">13+ = quick win, do now</text>
  <text x="80" y="300" font-size="11" fill="#71717a">5-12 = sequence by score</text>
  <text x="80" y="318" font-size="11" fill="#71717a">&lt;4 = cut or defer indefinitely</text>
</svg>
