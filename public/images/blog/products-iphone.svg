<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="440" fill="#f9f7f4" rx="12"/>

  <!-- iPhone 2007 body -->
  <rect x="310" y="40" width="180" height="360" rx="28" fill="#e8e4df" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Screen -->
  <rect x="330" y="100" width="140" height="220" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Screen content (app grid suggestion) -->
  <rect x="344" y="118" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="376" y="118" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="408" y="118" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="440" y="118" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="344" y="152" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="376" y="152" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="408" y="152" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>
  <rect x="440" y="152" width="24" height="24" rx="4" fill="#ddd" stroke="#ccc" stroke-width="0.5"/>

  <!-- Touch gesture lines on screen (multi-touch indicator) -->
  <circle cx="380" cy="240" r="12" fill="none" stroke="#E8765A" stroke-width="1.5" opacity="0.6"/>
  <circle cx="420" cy="260" r="12" fill="none" stroke="#E8765A" stroke-width="1.5" opacity="0.6"/>
  <line x1="380" y1="240" x2="370" y2="225" stroke="#E8765A" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <line x1="420" y1="260" x2="435" y2="278" stroke="#E8765A" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <text x="400" y="300" text-anchor="middle" font-size="8" fill="#E8765A" opacity="0.7">pinch to zoom</text>

  <!-- Earpiece/speaker -->
  <rect x="378" y="62" width="44" height="6" rx="3" fill="#bbb" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Home button -->
  <circle cx="400" cy="370" r="16" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="393" y="363" width="14" height="14" rx="2" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- ANNOTATION 1: Earpiece → SHOWSTOPPER -->
  <line x1="378" y1="65" x2="170" y2="65" stroke="#2a2a2a" stroke-width="1.2"/>
  <circle cx="170" cy="65" r="3" fill="#2a2a2a"/>

  <rect x="30" y="40" width="150" height="55" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
  <text x="105" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a">Voice calls</text>
  <text x="105" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#71717a">SHOWSTOPPER</text>
  <text x="105" y="88" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">good enough, no more</text>

  <!-- ANNOTATION 2: Screen → GAMECHANGER -->
  <line x1="470" y1="245" x2="560" y2="245" stroke="#E8765A" stroke-width="1.8"/>
  <circle cx="560" cy="245" r="3" fill="#E8765A"/>

  <rect x="570" y="210" width="190" height="70" rx="6" fill="#E8765A" opacity="0.08" stroke="#E8765A" stroke-width="2"/>
  <text x="665" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#E8765A">Multi-touch screen</text>
  <text x="665" y="253" text-anchor="middle" font-size="13" font-weight="800" fill="#E8765A">GAMECHANGER</text>
  <text x="665" y="270" text-anchor="middle" font-size="9" fill="#E8765A" font-style="italic">&#9733; the reason to buy</text>

  <!-- Additional showstopper annotation -->
  <line x1="310" y1="370" x2="170" y2="370" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="90" y="365" text-anchor="middle" font-size="9" fill="#aaa">No copy-paste</text>
  <text x="90" y="378" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">(shipped anyway)</text>

  <!-- Year label -->
  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#71717a" font-style="italic">iPhone, 2007</text>
</svg>
