<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="400" fill="#f9f7f4" rx="12"/>

  <!-- Pile of backlog cards under the hippo -->
  <rect x="240" y="250" width="140" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(-5, 310, 267)"/>
  <rect x="300" y="255" width="140" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(3, 370, 272)"/>
  <rect x="350" y="248" width="140" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(-2, 420, 265)"/>
  <rect x="260" y="265" width="140" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(4, 330, 282)"/>
  <rect x="320" y="260" width="140" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="380" y="258" width="140" height="35" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(-3, 450, 275)"/>

  <!-- Lines on cards -->
  <line x1="260" y1="272" x2="360" y2="268" stroke="#ddd" stroke-width="1"/>
  <line x1="340" y1="274" x2="420" y2="274" stroke="#ddd" stroke-width="1"/>
  <line x1="400" y1="268" x2="500" y2="265" stroke="#ddd" stroke-width="1"/>

  <!-- Hippo body (sitting on cards) -->
  <ellipse cx="400" cy="210" rx="110" ry="70" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.8"/>

  <!-- Hippo head -->
  <ellipse cx="400" cy="130" rx="65" ry="50" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.8"/>

  <!-- Hippo snout -->
  <ellipse cx="400" cy="155" rx="40" ry="25" fill="#ddd8d2" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Nostrils -->
  <circle cx="388" cy="155" r="4" fill="#2a2a2a"/>
  <circle cx="412" cy="155" r="4" fill="#2a2a2a"/>

  <!-- Eyes -->
  <circle cx="375" cy="120" r="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="375" cy="120" r="3" fill="#2a2a2a"/>
  <circle cx="425" cy="120" r="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="425" cy="120" r="3" fill="#2a2a2a"/>

  <!-- Ears -->
  <ellipse cx="350" cy="95" rx="15" ry="10" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(-20, 350, 95)"/>
  <ellipse cx="450" cy="95" rx="15" ry="10" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(20, 450, 95)"/>

  <!-- Tie (accent color!) -->
  <polygon points="400,175 388,210 400,200 412,210" fill="#E8765A" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="393" y="170" width="14" height="10" rx="2" fill="#E8765A" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Hippo legs -->
  <rect x="330" y="255" width="28" height="40" rx="10" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="440" y="255" width="28" height="40" rx="10" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- PM figure 1 (left) - holding chart -->
  <circle cx="130" cy="200" r="14" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="130" y1="214" x2="130" y2="270" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="130" y1="230" x2="110" y2="250" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="130" y1="230" x2="155" y2="220" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="130" y1="270" x2="118" y2="310" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="130" y1="270" x2="142" y2="310" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Chart in PM1's hand -->
  <rect x="148" y="206" width="40" height="30" rx="2" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <polyline points="155,230 162,222 169,226 176,216 183,220" fill="none" stroke="#E8765A" stroke-width="1.5"/>

  <!-- PM figure 2 (right) - looking concerned -->
  <circle cx="670" cy="200" r="14" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="214" x2="670" y2="270" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="235" x2="650" y2="255" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="235" x2="690" y2="255" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="270" x2="658" y2="310" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="270" x2="682" y2="310" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Clipboard in PM2's hand -->
  <rect x="684" y="242" width="30" height="38" rx="2" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="690" y1="252" x2="708" y2="252" stroke="#ccc" stroke-width="1"/>
  <line x1="690" y1="258" x2="705" y2="258" stroke="#ccc" stroke-width="1"/>
  <line x1="690" y1="264" x2="708" y2="264" stroke="#ccc" stroke-width="1"/>
  <line x1="690" y1="270" x2="702" y2="270" stroke="#ccc" stroke-width="1"/>

  <!-- Concerned expression marks -->
  <text x="120" y="190" font-size="14" fill="#2a2a2a">?</text>
  <text x="680" y="190" font-size="14" fill="#2a2a2a">!</text>

  <!-- Caption -->
  <text x="400" y="355" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="500" font-style="italic">HiPPO: Highest Paid Person's Opinion</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#71717a" font-style="italic">sitting on your backlog since forever</text>
</svg>
