<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="380" fill="#f9f7f4" rx="12"/>

  <!-- Table -->
  <ellipse cx="400" cy="300" rx="200" ry="40" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Feature card on table -->
  <rect x="340" y="270" width="120" height="40" rx="5" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="400" y="286" text-anchor="middle" font-size="10" font-weight="600" fill="#2a2a2a">Feature X</text>
  <line x1="358" y1="296" x2="442" y2="296" stroke="#ddd" stroke-width="1"/>

  <!-- Person 1 (far left) holding card: 5 -->
  <circle cx="120" cy="180" r="18" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="120" y1="198" x2="120" y2="260" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="120" y1="215" x2="95" y2="245" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="120" y1="215" x2="148" y2="195" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="120" y1="260" x2="108" y2="300" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="120" y1="260" x2="132" y2="300" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Card -->
  <rect x="140" y="160" width="36" height="50" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="158" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#E8765A">5</text>

  <!-- Person 2 (left-center) holding card: 4 -->
  <circle cx="260" cy="140" r="18" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="260" y1="158" x2="260" y2="230" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="260" y1="178" x2="238" y2="210" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="260" y1="178" x2="288" y2="155" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="260" y1="230" x2="248" y2="275" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="260" y1="230" x2="272" y2="275" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Card -->
  <rect x="280" y="120" width="36" height="50" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="298" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#E8765A">4</text>

  <!-- Person 3 (center) holding card: 1 (the outlier!) -->
  <circle cx="400" cy="120" r="18" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="400" y1="138" x2="400" y2="215" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="400" y1="160" x2="375" y2="190" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="400" y1="160" x2="430" y2="135" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="400" y1="215" x2="388" y2="265" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="400" y1="215" x2="412" y2="265" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Card (outlier - highlighted) -->
  <rect x="422" y="100" width="40" height="52" rx="4" fill="#fff" stroke="#E8765A" stroke-width="2.5"/>
  <text x="442" y="134" text-anchor="middle" font-size="24" font-weight="800" fill="#E8765A">1</text>

  <!-- Discussion burst around the 1 -->
  <text x="472" y="108" font-size="14" fill="#E8765A" font-weight="700">!</text>
  <text x="468" y="145" font-size="10" fill="#E8765A" font-style="italic">why?</text>

  <!-- Person 4 (right-center) holding card: 3 -->
  <circle cx="540" cy="140" r="18" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="540" y1="158" x2="540" y2="230" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="540" y1="178" x2="518" y2="155" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="540" y1="178" x2="562" y2="210" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="540" y1="230" x2="528" y2="275" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="540" y1="230" x2="552" y2="275" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Card -->
  <rect x="504" y="120" width="36" height="50" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="522" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#E8765A">3</text>

  <!-- Person 5 (far right) holding card: 5 -->
  <circle cx="670" cy="180" r="18" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="198" x2="670" y2="260" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="215" x2="648" y2="195" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="215" x2="695" y2="245" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="260" x2="658" y2="300" stroke="#2a2a2a" stroke-width="1.5"/>
  <line x1="670" y1="260" x2="682" y2="300" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Card -->
  <rect x="638" y="160" width="36" height="50" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <text x="656" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#E8765A">5</text>

  <!-- Caption -->
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#2a2a2a" font-weight="500" font-style="italic">Wide spread triggers discussion. Consensus confirms priority.</text>
</svg>
