<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="480" fill="#fafafa" rx="12"/>

  <!-- Vertical card stack -->
  <!-- Card 1 -->
  <rect x="120" y="20" width="560" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="120" y="20" width="6" height="52" rx="3" fill="#18181b"/>
  <text x="146" y="42" font-size="13" font-weight="700" fill="#18181b">Requirement Intro</text>
  <text x="146" y="60" font-size="11" fill="#71717a">"Users need to filter search results by date range"</text>

  <!-- Connector -->
  <line x1="400" y1="72" x2="400" y2="86" stroke="#d4d4d8" stroke-width="1.2"/>

  <!-- Card 2 -->
  <rect x="120" y="86" width="560" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="120" y="86" width="6" height="52" rx="3" fill="#3f3f46"/>
  <text x="146" y="108" font-size="13" font-weight="700" fill="#18181b">Motivation &amp; Problem Description</text>
  <text x="146" y="126" font-size="11" fill="#71717a">"42% of support tickets mention inability to find recent items"</text>

  <!-- Connector -->
  <line x1="400" y1="138" x2="400" y2="152" stroke="#d4d4d8" stroke-width="1.2"/>

  <!-- Card 3 -->
  <rect x="120" y="152" width="560" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="120" y="152" width="6" height="52" rx="3" fill="#52525b"/>
  <text x="146" y="174" font-size="13" font-weight="700" fill="#18181b">Functional Requirements</text>
  <text x="146" y="192" font-size="11" fill="#71717a">"Date picker with preset ranges: today, 7d, 30d, custom"</text>

  <!-- Connector -->
  <line x1="400" y1="204" x2="400" y2="218" stroke="#d4d4d8" stroke-width="1.2"/>

  <!-- Card 4 -->
  <rect x="120" y="218" width="560" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="120" y="218" width="6" height="52" rx="3" fill="#71717a"/>
  <text x="146" y="240" font-size="13" font-weight="700" fill="#18181b">Non-functional Requirements</text>
  <text x="146" y="258" font-size="11" fill="#71717a">"Filter results must render in &lt;200ms on 3G connections"</text>

  <!-- Connector -->
  <line x1="400" y1="270" x2="400" y2="284" stroke="#d4d4d8" stroke-width="1.2"/>

  <!-- Card 5 -->
  <rect x="120" y="284" width="560" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="120" y="284" width="6" height="52" rx="3" fill="#a1a1aa"/>
  <text x="146" y="306" font-size="13" font-weight="700" fill="#18181b">Interaction Processes</text>
  <text x="146" y="324" font-size="11" fill="#71717a">"User selects range, results update live without page reload"</text>

  <!-- Connector -->
  <line x1="400" y1="336" x2="400" y2="350" stroke="#d4d4d8" stroke-width="1.2"/>

  <!-- Card 6 -->
  <rect x="120" y="350" width="560" height="52" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <rect x="120" y="350" width="6" height="52" rx="3" fill="#d4d4d8"/>
  <text x="146" y="372" font-size="13" font-weight="700" fill="#18181b">Technical Considerations</text>
  <text x="146" y="390" font-size="11" fill="#71717a">"Depends on search API v2; requires index on created_at"</text>

  <!-- Connector -->
  <line x1="400" y1="402" x2="400" y2="416" stroke="#d4d4d8" stroke-width="1.2"/>

  <!-- Card 7: Acceptance Criteria (emphasized) -->
  <rect x="120" y="416" width="560" height="52" rx="8" fill="#18181b" stroke="none"/>
  <text x="146" y="438" font-size="13" font-weight="700" fill="#fff">Acceptance Criteria</text>
  <text x="146" y="456" font-size="11" fill="#a1a1aa">"Given a date range, when applied, then only matching items are shown"</text>
</svg>
