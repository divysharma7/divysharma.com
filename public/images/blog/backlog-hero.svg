<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="400" fill="#f9f7f4" rx="12"/>

  <!-- Stack of backlog cards (back) -->
  <rect x="280" y="60" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(-1, 380, 85)"/>
  <rect x="278" y="75" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(0.5, 378, 100)"/>
  <rect x="282" y="90" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(-0.3, 382, 115)"/>
  <rect x="279" y="105" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="281" y="120" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(0.8, 381, 145)"/>
  <rect x="280" y="135" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5" transform="rotate(-0.5, 380, 160)"/>
  <rect x="278" y="150" width="200" height="50" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Lines on cards to suggest text -->
  <line x1="295" y1="162" x2="420" y2="162" stroke="#d4d4d4" stroke-width="1.5"/>
  <line x1="295" y1="172" x2="390" y2="172" stroke="#d4d4d4" stroke-width="1.5"/>
  <line x1="295" y1="140" x2="430" y2="140" stroke="#d4d4d4" stroke-width="1.5"/>
  <line x1="295" y1="150" x2="400" y2="150" stroke="#d4d4d4" stroke-width="1.5"/>

  <!-- Card being pulled out (prioritized - accent color) -->
  <rect x="520" y="80" width="200" height="55" rx="6" fill="#E8765A" stroke="#2a2a2a" stroke-width="1.8" transform="rotate(3, 620, 107)" opacity="0.9"/>
  <text x="545" y="103" font-size="11" fill="#fff" font-weight="600" transform="rotate(3, 620, 107)">&#9733; HIGH PRIORITY</text>
  <line x1="545" y1="115" x2="690" y2="118" stroke="#fff" stroke-width="1.2" opacity="0.6"/>
  <line x1="545" y1="124" x2="660" y2="126" stroke="#fff" stroke-width="1.2" opacity="0.6"/>

  <!-- Card being moved down (deprioritized) -->
  <rect x="520" y="260" width="200" height="55" rx="6" fill="#fff" stroke="#2a2a2a" stroke-width="1.2" transform="rotate(-2, 620, 287)" opacity="0.5"/>
  <line x1="540" y1="278" x2="700" y2="275" stroke="#ccc" stroke-width="1.2"/>
  <line x1="540" y1="288" x2="670" y2="286" stroke="#ccc" stroke-width="1.2"/>
  <!-- X mark -->
  <line x1="690" y1="272" x2="705" y2="300" stroke="#E8765A" stroke-width="2" opacity="0.7"/>
  <line x1="705" y1="272" x2="690" y2="300" stroke="#E8765A" stroke-width="2" opacity="0.7"/>

  <!-- Arrow: card going up -->
  <path d="M510 130 C530 100, 530 95, 520 85" stroke="#2a2a2a" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <polygon points="518,87 524,80 512,82" fill="#2a2a2a"/>

  <!-- Arrow: card going down -->
  <path d="M510 185 C530 220, 530 240, 520 260" stroke="#2a2a2a" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <polygon points="522,258 518,268 528,262" fill="#2a2a2a"/>

  <!-- Hand illustration (simplified) -->
  <path d="M160 140 C170 120, 200 110, 220 115 L270 130 C275 132, 278 138, 275 142 L220 155 C200 160, 170 155, 160 140Z" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M220 115 L240 108 C250 105, 258 108, 260 115 L270 130" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M230 118 L245 110" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Labels -->
  <text x="400" y="340" text-anchor="middle" font-size="14" fill="#2a2a2a" font-weight="600" font-style="italic">Prioritize: pull the high-value items up,</text>
  <text x="400" y="362" text-anchor="middle" font-size="14" fill="#2a2a2a" font-weight="600" font-style="italic">push the distractions down.</text>

  <!-- Small decorative stars -->
  <text x="540" y="165" font-size="14" fill="#E8765A">&#9733;</text>
  <text x="160" y="100" font-size="10" fill="#E8765A">&#9733;</text>
  <text x="720" y="200" font-size="12" fill="#E8765A">&#9733;</text>
</svg>
