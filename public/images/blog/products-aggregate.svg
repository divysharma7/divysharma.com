<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="340" fill="#f9f7f4" rx="12"/>

  <!-- LEFT SIDE: Isolated features (faded) -->
  <!-- Icon -->
  <rect x="60" y="70" width="90" height="80" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2" opacity="0.6"/>
  <rect x="82" y="88" width="46" height="46" rx="8" fill="#eee" stroke="#ccc" stroke-width="1"/>
  <text x="105" y="118" text-anchor="middle" font-size="18" fill="#ccc">&#9678;</text>
  <text x="105" y="168" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">unique icon</text>

  <!-- Color swatch -->
  <rect x="60" y="185" width="90" height="50" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2" opacity="0.6"/>
  <rect x="74" y="195" width="62" height="28" rx="4" fill="#e8e4df" stroke="#ccc" stroke-width="1"/>
  <text x="105" y="252" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">color scheme</text>

  <!-- Phone case -->
  <rect x="60" y="265" width="90" height="50" rx="6" fill="#fff" stroke="#ccc" stroke-width="1.2" opacity="0.6"/>
  <rect x="85" y="272" width="40" height="36" rx="8" fill="none" stroke="#ccc" stroke-width="1.5"/>
  <text x="105" y="326" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">phone case</text>

  <!-- "forgettable alone" label -->
  <text x="105" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#aaa">Forgettable alone</text>

  <!-- PLUS SIGNS -->
  <text x="175" y="130" text-anchor="middle" font-size="24" fill="#ccc" font-weight="300">+</text>
  <text x="175" y="220" text-anchor="middle" font-size="24" fill="#ccc" font-weight="300">+</text>

  <!-- ARROW -->
  <line x1="220" y1="190" x2="380" y2="190" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="8 4"/>
  <polygon points="378,185 392,190 378,195" fill="#2a2a2a"/>
  <text x="300" y="178" text-anchor="middle" font-size="10" fill="#71717a" font-style="italic">combined</text>

  <!-- RIGHT SIDE: Assembled product (bold, accent color) -->
  <rect x="410" y="50" width="340" height="260" rx="10" fill="#E8765A" opacity="0.06" stroke="#E8765A" stroke-width="2"/>

  <!-- Assembled phone -->
  <rect x="520" y="80" width="120" height="200" rx="16" fill="#E8765A" opacity="0.12" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Screen with the icon as home screen -->
  <rect x="535" y="115" width="90" height="130" rx="3" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Icon on screen -->
  <rect x="556" y="135" width="48" height="48" rx="10" fill="#E8765A" opacity="0.2" stroke="#E8765A" stroke-width="1.5"/>
  <text x="580" y="165" text-anchor="middle" font-size="22" fill="#E8765A">&#9678;</text>
  <!-- Color applied to body (the fill above) -->

  <!-- Case outline around phone -->
  <rect x="516" y="76" width="128" height="208" rx="18" fill="none" stroke="#E8765A" stroke-width="2" stroke-dasharray="6 3" opacity="0.5"/>

  <!-- Speaker -->
  <rect x="563" y="92" width="34" height="4" rx="2" fill="#bbb"/>
  <!-- Home button -->
  <circle cx="580" cy="260" r="10" fill="none" stroke="#2a2a2a" stroke-width="1.2"/>

  <!-- Sparkle marks -->
  <text x="650" y="110" font-size="14" fill="#E8765A">&#10022;</text>
  <text x="510" y="95" font-size="10" fill="#E8765A">&#10022;</text>
  <text x="660" y="240" font-size="12" fill="#E8765A">&#10022;</text>
  <text x="505" y="260" font-size="8" fill="#E8765A">&#10022;</text>

  <!-- Label -->
  <text x="580" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#E8765A">Gamechanger together</text>

  <!-- Annotation labels on right side -->
  <text x="670" y="145" font-size="10" fill="#2a2a2a">icon &#10003;</text>
  <text x="670" y="165" font-size="10" fill="#2a2a2a">color &#10003;</text>
  <text x="670" y="185" font-size="10" fill="#2a2a2a">case &#10003;</text>
  <text x="670" y="210" font-size="10" fill="#E8765A" font-weight="600">= design language</text>

  <!-- Bottom warning -->
  <text x="580" y="326" text-anchor="middle" font-size="11" fill="#71717a" font-style="italic">Dangerous: hard to tell which combination tips the scale</text>
</svg>
