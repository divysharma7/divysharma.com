<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="380" fill="#fafafa" rx="12"/>

  <!-- Growth Team box -->
  <rect x="40" y="40" width="420" height="260" rx="10" fill="#fff" stroke="#3f3f46" stroke-width="1.8"/>
  <text x="250" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Growth Team</text>
  <text x="250" y="90" text-anchor="middle" font-size="12" fill="#71717a">~60 people</text>

  <!-- Sub-boxes inside growth -->
  <rect x="65" y="110" width="115" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="122" y="133" text-anchor="middle" font-size="12" font-weight="500" fill="#3f3f46">Data Science</text>
  <text x="122" y="149" text-anchor="middle" font-size="10" fill="#71717a">Analytics, A/B tests</text>

  <rect x="195" y="110" width="115" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="252" y="133" text-anchor="middle" font-size="12" font-weight="500" fill="#3f3f46">Design</text>
  <text x="252" y="149" text-anchor="middle" font-size="10" fill="#71717a">UX, landing pages</text>

  <rect x="325" y="110" width="115" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="382" y="133" text-anchor="middle" font-size="12" font-weight="500" fill="#3f3f46">Copywriting</text>
  <text x="382" y="149" text-anchor="middle" font-size="10" fill="#71717a">Ads, email, web</text>

  <rect x="130" y="175" width="160" height="50" rx="6" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="210" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="#3f3f46">Performance Marketing</text>
  <text x="210" y="214" text-anchor="middle" font-size="10" fill="#71717a">Paid channels, spend</text>

  <!-- Separate Engineering box -->
  <rect x="500" y="40" width="270" height="120" rx="10" fill="#fff" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="635" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#3f3f46">Engineering</text>
  <text x="635" y="90" text-anchor="middle" font-size="12" fill="#71717a">Separate leader</text>
  <text x="635" y="110" text-anchor="middle" font-size="12" fill="#71717a">Separate roadmap</text>
  <text x="635" y="130" text-anchor="middle" font-size="12" fill="#71717a">Shared queue</text>

  <!-- Separate Product box -->
  <rect x="500" y="180" width="270" height="120" rx="10" fill="#fff" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="635" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#3f3f46">Product</text>
  <text x="635" y="232" text-anchor="middle" font-size="12" fill="#71717a">~30-40 people</text>
  <text x="635" y="252" text-anchor="middle" font-size="12" fill="#71717a">Own designers &amp; tech</text>
  <text x="635" y="272" text-anchor="middle" font-size="12" fill="#71717a">Separate roadmap</text>

  <!-- Arrows showing dependency -->
  <line x1="460" y1="100" x2="498" y2="100" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="460" y1="240" x2="498" y2="240" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- "Roadmap fights" annotation -->
  <text x="250" y="340" text-anchor="middle" font-size="13" fill="#18181b" font-weight="500">Solid border = same team</text>
  <text x="600" y="340" text-anchor="middle" font-size="13" fill="#71717a">Dashed border = separate org, shared queue</text>
  <text x="480" y="365" text-anchor="middle" font-size="12" font-style="italic" fill="#71717a">This is where roadmap fights happen  &#8594;</text>
</svg>
