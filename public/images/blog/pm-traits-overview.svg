<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="Inter, 'Helvetica Neue', sans-serif">
  <rect width="1080" height="600" rx="16" fill="#F4EFE6"/>

  <!-- Title -->
  <text x="540" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A" letter-spacing="-0.01em">Nine traits that separate great PMs from the rest</text>

  <!-- Grid of trait cards — 3x3 -->
  <!-- Row 1 -->
  <rect x="60" y="88" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="208" y="132" text-anchor="middle" font-size="28" fill="#E8765A">?</text>
  <text x="208" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Curiosity</text>
  <text x="208" y="194" text-anchor="middle" font-size="13" fill="#6B6B6B">Ask the mundane questions</text>
  <text x="208" y="212" text-anchor="middle" font-size="13" fill="#6B6B6B">everyone else skips</text>

  <rect x="392" y="88" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="540" y="132" text-anchor="middle" font-size="28" fill="#E8765A">&lt;/&gt;</text>
  <text x="540" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Technical Knowledge</text>
  <text x="540" y="194" text-anchor="middle" font-size="13" fill="#6B6B6B">Know enough to talk</text>
  <text x="540" y="212" text-anchor="middle" font-size="13" fill="#6B6B6B">to engineering as equals</text>

  <rect x="724" y="88" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="872" y="132" text-anchor="middle" font-size="28" fill="#E8765A">&#9829;</text>
  <text x="872" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Customer-Focused</text>
  <text x="872" y="194" text-anchor="middle" font-size="13" fill="#6B6B6B">User needs over</text>
  <text x="872" y="212" text-anchor="middle" font-size="13" fill="#6B6B6B">stakeholder desires</text>

  <!-- Row 2 -->
  <rect x="60" y="248" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="208" y="292" text-anchor="middle" font-size="28" fill="#E8765A">&#9733;</text>
  <text x="208" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Visionary</text>
  <text x="208" y="354" text-anchor="middle" font-size="13" fill="#6B6B6B">See where the product</text>
  <text x="208" y="372" text-anchor="middle" font-size="13" fill="#6B6B6B">is going, not just where it is</text>

  <rect x="392" y="248" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="540" y="292" text-anchor="middle" font-size="28" fill="#E8765A">&#9650;</text>
  <text x="540" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Leadership</text>
  <text x="540" y="354" text-anchor="middle" font-size="13" fill="#6B6B6B">Align stakeholders, build</text>
  <text x="540" y="372" text-anchor="middle" font-size="13" fill="#6B6B6B">consensus, manage upward</text>

  <rect x="724" y="248" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="872" y="292" text-anchor="middle" font-size="28" fill="#E8765A">&#8595;</text>
  <text x="872" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Humility</text>
  <text x="872" y="354" text-anchor="middle" font-size="13" fill="#6B6B6B">Admit mistakes, seek</text>
  <text x="872" y="372" text-anchor="middle" font-size="13" fill="#6B6B6B">feedback, stay open-minded</text>

  <!-- Row 3 -->
  <rect x="60" y="408" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="208" y="452" text-anchor="middle" font-size="28" fill="#E8765A">&#9679;</text>
  <text x="208" y="488" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Analytical</text>
  <text x="208" y="514" text-anchor="middle" font-size="13" fill="#6B6B6B">Data-driven decisions,</text>
  <text x="208" y="532" text-anchor="middle" font-size="13" fill="#6B6B6B">not gut feelings</text>

  <rect x="392" y="408" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="540" y="452" text-anchor="middle" font-size="28" fill="#E8765A">&#9881;</text>
  <text x="540" y="488" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Process-Oriented</text>
  <text x="540" y="514" text-anchor="middle" font-size="13" fill="#6B6B6B">Fix and improve workflows,</text>
  <text x="540" y="532" text-anchor="middle" font-size="13" fill="#6B6B6B">not just the product</text>

  <rect x="724" y="408" width="296" height="140" rx="12" fill="#fff" stroke="#E2DDD4" stroke-width="1.5"/>
  <text x="872" y="452" text-anchor="middle" font-size="28" fill="#E8765A">&#8593;</text>
  <text x="872" y="488" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">Mentoring</text>
  <text x="872" y="514" text-anchor="middle" font-size="13" fill="#6B6B6B">Level up your team,</text>
  <text x="872" y="532" text-anchor="middle" font-size="13" fill="#6B6B6B">share knowledge generously</text>
</svg>