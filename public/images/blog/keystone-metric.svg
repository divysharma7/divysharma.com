<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="340" fill="#fafafa" rx="12"/>

  <!-- LEFT PANEL: Facebook (clean) -->
  <rect x="30" y="30" width="355" height="280" rx="10" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="207" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#3f3f46">Facebook</text>
  <text x="207" y="80" text-anchor="middle" font-size="12" fill="#71717a">Clean keystone</text>

  <!-- New user icon -->
  <circle cx="120" cy="170" r="28" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="120" y="168" text-anchor="middle" font-size="10" fill="#71717a">New</text>
  <text x="120" y="181" text-anchor="middle" font-size="10" fill="#71717a">user</text>

  <!-- Single clean arrow -->
  <line x1="150" y1="170" x2="210" y2="170" stroke="#3f3f46" stroke-width="2.5" marker-end="url(#arrowDark)"/>

  <!-- Keystone target -->
  <rect x="215" y="140" width="150" height="60" rx="8" fill="#18181b" stroke="none"/>
  <text x="290" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">7 friends</text>
  <text x="290" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">in 10 days</text>

  <!-- Outcome -->
  <text x="207" y="240" text-anchor="middle" font-size="12" fill="#3f3f46">One behavior. One window.</text>
  <text x="207" y="258" text-anchor="middle" font-size="12" fill="#3f3f46">One arrow.</text>
  <text x="207" y="290" text-anchor="middle" font-size="12" font-style="italic" fill="#22c55e">Predictive and actionable</text>

  <!-- Divider -->
  <line x1="400" y1="40" x2="400" y2="300" stroke="#e4e4e7" stroke-width="1"/>

  <!-- RIGHT PANEL: Most products (messy cluster) -->
  <rect x="415" y="30" width="355" height="280" rx="10" fill="#fff" stroke="#d4d4d8" stroke-width="1"/>
  <text x="592" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#3f3f46">Most Products</text>
  <text x="592" y="80" text-anchor="middle" font-size="12" fill="#71717a">Signal cluster</text>

  <!-- Multiple signal sources -->
  <rect x="440" y="108" width="110" height="30" rx="5" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="495" y="128" text-anchor="middle" font-size="11" fill="#3f3f46">Time on site</text>

  <rect x="440" y="148" width="140" height="30" rx="5" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="510" y="168" text-anchor="middle" font-size="11" fill="#3f3f46">Multi-channel inbound</text>

  <rect x="440" y="188" width="120" height="30" rx="5" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="500" y="208" text-anchor="middle" font-size="11" fill="#3f3f46">Repeat ad views</text>

  <rect x="440" y="228" width="100" height="30" rx="5" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
  <text x="490" y="248" text-anchor="middle" font-size="11" fill="#3f3f46">Form fills</text>

  <!-- Messy arrows converging -->
  <line x1="552" y1="123" x2="660" y2="163" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrowLight)"/>
  <line x1="582" y1="163" x2="660" y2="170" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrowLight)"/>
  <line x1="562" y1="203" x2="660" y2="177" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrowLight)"/>
  <line x1="542" y1="243" x2="660" y2="183" stroke="#a1a1aa" stroke-width="1.2" marker-end="url(#arrowLight)"/>

  <!-- Fuzzy target -->
  <rect x="665" y="145" width="80" height="56" rx="8" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="705" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#a1a1aa">???</text>
  <text x="705" y="188" text-anchor="middle" font-size="9" fill="#a1a1aa">which is</text>
  <text x="705" y="198" text-anchor="middle" font-size="9" fill="#a1a1aa">causal?</text>

  <!-- Outcome -->
  <text x="592" y="290" text-anchor="middle" font-size="12" font-style="italic" fill="#71717a">Correlated, messy, closer to reality</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f3f46"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
  </defs>
</svg>
