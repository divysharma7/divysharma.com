<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="360" fill="#fafafa" rx="12"/>

  <!-- Panel 1: Product Health — abstract line graph -->
  <g transform="translate(60, 60)">
    <rect width="200" height="240" rx="8" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>
    <!-- Metric line -->
    <polyline points="30,180 60,160 90,140 120,120 150,130 170,100" fill="none" stroke="#E8765A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Baseline -->
    <line x1="30" y1="200" x2="170" y2="200" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Abstract bars beneath -->
    <rect x="30" y="170" width="16" height="30" rx="2" fill="#1a2845" opacity="0.15"/>
    <rect x="58" y="155" width="16" height="45" rx="2" fill="#1a2845" opacity="0.2"/>
    <rect x="86" y="145" width="16" height="55" rx="2" fill="#1a2845" opacity="0.25"/>
    <rect x="114" y="150" width="16" height="50" rx="2" fill="#1a2845" opacity="0.2"/>
    <rect x="142" y="140" width="16" height="60" rx="2" fill="#1a2845" opacity="0.3"/>
    <!-- Label -->
    <text x="100" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#3f3f46">Health</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(275, 170)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#a1a1aa" stroke-width="1.5"/>
    <polygon points="30,-4 38,0 30,4" fill="#a1a1aa"/>
  </g>

  <!-- Panel 2: Discovery — magnifying glass over layers -->
  <g transform="translate(300, 60)">
    <rect width="200" height="240" rx="8" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>
    <!-- Layered surfaces -->
    <rect x="50" y="120" width="100" height="16" rx="3" fill="#1a2845" opacity="0.08"/>
    <rect x="55" y="140" width="90" height="16" rx="3" fill="#1a2845" opacity="0.12"/>
    <rect x="60" y="160" width="80" height="16" rx="3" fill="#1a2845" opacity="0.18"/>
    <rect x="65" y="180" width="70" height="16" rx="3" fill="#1a2845" opacity="0.25"/>
    <!-- Magnifying glass -->
    <circle cx="110" cy="130" r="28" fill="none" stroke="#E8765A" stroke-width="2.5"/>
    <line x1="130" y1="150" x2="148" y2="168" stroke="#E8765A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Label -->
    <text x="100" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#3f3f46">Discovery</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(515, 170)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#a1a1aa" stroke-width="1.5"/>
    <polygon points="30,-4 38,0 30,4" fill="#a1a1aa"/>
  </g>

  <!-- Panel 3: Delivery — stacked blocks -->
  <g transform="translate(540, 60)">
    <rect width="200" height="240" rx="8" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>
    <!-- Stacked blocks (completed work) -->
    <rect x="55" y="100" width="90" height="24" rx="4" fill="#1a2845" opacity="0.35"/>
    <rect x="55" y="130" width="90" height="24" rx="4" fill="#1a2845" opacity="0.3"/>
    <rect x="55" y="160" width="90" height="24" rx="4" fill="#E8765A" opacity="0.5"/>
    <!-- Completion indicator -->
    <rect x="55" y="190" width="60" height="8" rx="4" fill="#d4d4d8"/>
    <rect x="55" y="190" width="48" height="8" rx="4" fill="#E8765A" opacity="0.7"/>
    <!-- Label -->
    <text x="100" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#3f3f46">Delivery</text>
  </g>
</svg>
