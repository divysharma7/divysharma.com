<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="440" fill="#fafafa" rx="12"/>

  <!-- Wall/display with three abstract data shapes -->
  <rect x="180" y="60" width="440" height="200" rx="6" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>

  <!-- Shape 1: abstract upward trend -->
  <g transform="translate(220, 100)">
    <polyline points="0,100 25,85 50,70 75,50 100,35" fill="none" stroke="#1a2845" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="100" cy="35" r="5" fill="#E8765A" opacity="0.7"/>
  </g>

  <!-- Shape 2: concentric rings -->
  <g transform="translate(400, 160)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1a2845" stroke-width="1.5" opacity="0.15"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1a2845" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#E8765A" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#E8765A" opacity="0.7"/>
  </g>

  <!-- Shape 3: stacked bars -->
  <g transform="translate(490, 110)">
    <rect x="0" y="60" width="20" height="40" rx="2" fill="#1a2845" opacity="0.2"/>
    <rect x="28" y="40" width="20" height="60" rx="2" fill="#1a2845" opacity="0.25"/>
    <rect x="56" y="20" width="20" height="80" rx="2" fill="#E8765A" opacity="0.4"/>
    <rect x="84" y="30" width="20" height="70" rx="2" fill="#1a2845" opacity="0.3"/>
  </g>

  <!-- Two figures viewed from behind, looking at the display -->
  <!-- Figure 1 -->
  <circle cx="340" cy="340" r="16" fill="#1a2845" opacity="0.6"/>
  <rect x="328" y="362" width="24" height="55" rx="12" fill="#1a2845" opacity="0.6"/>

  <!-- Figure 2 -->
  <circle cx="440" cy="345" r="16" fill="#1a2845" opacity="0.45"/>
  <rect x="428" y="367" width="24" height="55" rx="12" fill="#1a2845" opacity="0.45"/>

  <!-- Subtle sight lines (dotted) connecting figures to display center -->
  <line x1="340" y1="330" x2="400" y2="220" stroke="#a1a1aa" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.4"/>
  <line x1="440" y1="335" x2="400" y2="220" stroke="#a1a1aa" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.4"/>
</svg>
