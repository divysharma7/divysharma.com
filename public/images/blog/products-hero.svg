<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="400" fill="#f9f7f4" rx="12"/>

  <!-- Workbench -->
  <rect x="60" y="280" width="680" height="12" rx="3" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="80" y="292" width="16" height="60" rx="2" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="704" y="292" width="16" height="60" rx="2" fill="#e8e4df" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Discard pile (left, faded) -->
  <rect x="90" y="230" width="70" height="40" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" transform="rotate(-8, 125, 250)" opacity="0.4"/>
  <rect x="95" y="225" width="70" height="40" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" transform="rotate(5, 130, 245)" opacity="0.4"/>
  <rect x="85" y="235" width="70" height="40" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" transform="rotate(-3, 120, 255)" opacity="0.4"/>
  <line x1="95" y1="235" x2="145" y2="270" stroke="#ccc" stroke-width="1" opacity="0.4"/>
  <line x1="145" y1="235" x2="95" y2="270" stroke="#ccc" stroke-width="1" opacity="0.4"/>
  <text x="120" y="220" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">distractions</text>

  <!-- Feature objects scattered on bench -->
  <rect x="200" y="238" width="65" height="36" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(-3, 232, 256)"/>
  <line x1="210" y1="250" x2="255" y2="249" stroke="#ddd" stroke-width="1"/>
  <line x1="210" y1="258" x2="245" y2="257" stroke="#ddd" stroke-width="1"/>

  <rect x="280" y="242" width="60" height="32" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(2, 310, 258)"/>
  <line x1="290" y1="254" x2="330" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="290" y1="262" x2="322" y2="263" stroke="#ddd" stroke-width="1"/>

  <rect x="460" y="240" width="55" height="34" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1" transform="rotate(-1, 487, 257)"/>
  <line x1="468" y1="252" x2="508" y2="252" stroke="#ddd" stroke-width="1"/>
  <line x1="468" y1="260" x2="500" y2="260" stroke="#ddd" stroke-width="1"/>

  <rect x="530" y="244" width="60" height="30" rx="4" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="538" y1="255" x2="582" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="538" y1="263" x2="572" y2="263" stroke="#ddd" stroke-width="1"/>

  <!-- Glowing/chosen features (accent color) -->
  <rect x="360" y="220" width="75" height="45" rx="5" fill="#E8765A" stroke="#2a2a2a" stroke-width="1.5" opacity="0.15"/>
  <rect x="360" y="220" width="75" height="45" rx="5" fill="none" stroke="#E8765A" stroke-width="2"/>
  <text x="397" y="240" text-anchor="middle" font-size="16" fill="#E8765A">&#9733;</text>
  <line x1="372" y1="250" x2="425" y2="250" stroke="#E8765A" stroke-width="1" opacity="0.5"/>
  <line x1="372" y1="258" x2="415" y2="258" stroke="#E8765A" stroke-width="1" opacity="0.5"/>

  <rect x="620" y="225" width="70" height="42" rx="5" fill="#E8765A" stroke="#2a2a2a" stroke-width="1.5" opacity="0.15"/>
  <rect x="620" y="225" width="70" height="42" rx="5" fill="none" stroke="#E8765A" stroke-width="2"/>
  <text x="655" y="244" text-anchor="middle" font-size="16" fill="#E8765A">&#9733;</text>
  <line x1="632" y1="254" x2="680" y2="254" stroke="#E8765A" stroke-width="1" opacity="0.5"/>

  <!-- Craftsperson (simplified figure examining a feature) -->
  <circle cx="400" cy="120" r="22" fill="#f9f7f4" stroke="#2a2a2a" stroke-width="1.8"/>
  <!-- Eyes looking down -->
  <circle cx="393" cy="118" r="2" fill="#2a2a2a"/>
  <circle cx="407" cy="118" r="2" fill="#2a2a2a"/>
  <!-- Body -->
  <line x1="400" y1="142" x2="400" y2="210" stroke="#2a2a2a" stroke-width="1.8"/>
  <!-- Left arm holding magnifying glass -->
  <line x1="400" y1="165" x2="345" y2="185" stroke="#2a2a2a" stroke-width="1.8"/>
  <!-- Right arm reaching to feature -->
  <line x1="400" y1="165" x2="450" y2="195" stroke="#2a2a2a" stroke-width="1.8"/>
  <!-- Legs -->
  <line x1="400" y1="210" x2="385" y2="275" stroke="#2a2a2a" stroke-width="1.8"/>
  <line x1="400" y1="210" x2="415" y2="275" stroke="#2a2a2a" stroke-width="1.8"/>

  <!-- Magnifying glass -->
  <circle cx="330" cy="195" r="18" fill="none" stroke="#2a2a2a" stroke-width="1.8"/>
  <line x1="343" y1="207" x2="355" y2="218" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Glass reflection -->
  <path d="M322 188 C325 185, 330 184, 333 186" fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- Feature being examined through glass -->
  <rect x="310" y="184" width="40" height="22" rx="3" fill="none" stroke="#E8765A" stroke-width="1.5" opacity="0.6"/>
  <text x="330" y="198" text-anchor="middle" font-size="8" fill="#E8765A">&#9733;</text>

  <!-- Caption -->
  <text x="400" y="345" text-anchor="middle" font-size="13" fill="#2a2a2a" font-weight="500" font-style="italic">The job is discrimination — not generation.</text>
  <text x="400" y="365" text-anchor="middle" font-size="12" fill="#71717a" font-style="italic">Which features are gamechangers, and which are noise?</text>
</svg>
