<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="800" height="420" fill="#f9f7f4" rx="12"/>

  <!-- Compass/lighthouse central element -->
  <circle cx="400" cy="200" r="80" fill="#E8765A" opacity="0.06" stroke="#E8765A" stroke-width="2.5"/>
  <circle cx="400" cy="200" r="60" fill="#fff" stroke="#E8765A" stroke-width="1.5"/>
  <circle cx="400" cy="200" r="5" fill="#E8765A"/>

  <!-- Compass needle -->
  <polygon points="400,150 396,200 400,145 404,200" fill="#E8765A"/>
  <polygon points="400,250 396,200 400,255 404,200" fill="#ddd"/>

  <!-- N/S/E/W marks -->
  <text x="400" y="152" text-anchor="middle" font-size="10" font-weight="700" fill="#E8765A">N</text>

  <!-- Mission text on the compass ring -->
  <text x="400" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#2a2a2a">"INDISTINGUISHABLE</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#2a2a2a">FROM MAGIC"</text>
  <text x="400" y="308" text-anchor="middle" font-size="9" fill="#71717a" font-style="italic">— RethinkDB product mission</text>

  <!-- Feature decisions flowing toward compass -->
  <!-- Top-left -->
  <rect x="80" y="50" width="120" height="40" rx="5" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
  <text x="140" y="67" text-anchor="middle" font-size="10" fill="#2a2a2a">Realtime queries</text>
  <text x="140" y="82" text-anchor="middle" font-size="8" fill="#E8765A">gamechanger?</text>
  <line x1="200" y1="78" x2="330" y2="170" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="328,168 334,175 325,174" fill="#2a2a2a"/>

  <!-- Top-right -->
  <rect x="600" y="40" width="130" height="40" rx="5" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
  <text x="665" y="57" text-anchor="middle" font-size="10" fill="#2a2a2a">SQL compatibility</text>
  <text x="665" y="72" text-anchor="middle" font-size="8" fill="#71717a">showstopper?</text>
  <line x1="600" y1="68" x2="470" y2="170" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="472,168 466,175 475,174" fill="#2a2a2a"/>

  <!-- Left -->
  <rect x="40" y="180" width="120" height="40" rx="5" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
  <text x="100" y="197" text-anchor="middle" font-size="10" fill="#2a2a2a">Admin dashboard</text>
  <text x="100" y="212" text-anchor="middle" font-size="8" fill="#71717a">showstopper?</text>
  <line x1="160" y1="200" x2="320" y2="200" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="318,196 326,200 318,204" fill="#2a2a2a"/>

  <!-- Right -->
  <rect x="640" y="170" width="120" height="40" rx="5" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
  <text x="700" y="187" text-anchor="middle" font-size="10" fill="#2a2a2a">Change feeds</text>
  <text x="700" y="202" text-anchor="middle" font-size="8" fill="#E8765A">gamechanger?</text>
  <line x1="640" y1="196" x2="480" y2="200" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="4 3"/>
  <polygon points="482,196 474,200 482,204" fill="#2a2a2a"/>

  <!-- Bottom-left -->
  <rect x="100" y="330" width="110" height="40" rx="5" fill="#fff" stroke="#ccc" stroke-width="1" opacity="0.6"/>
  <text x="155" y="347" text-anchor="middle" font-size="10" fill="#aaa">GUI designer</text>
  <text x="155" y="362" text-anchor="middle" font-size="8" fill="#aaa">distraction?</text>
  <line x1="210" y1="345" x2="340" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Bottom-right -->
  <rect x="580" y="320" width="130" height="40" rx="5" fill="#fff" stroke="#ccc" stroke-width="1" opacity="0.6"/>
  <text x="645" y="337" text-anchor="middle" font-size="10" fill="#aaa">Mobile client SDK</text>
  <text x="645" y="352" text-anchor="middle" font-size="8" fill="#aaa">distraction?</text>
  <line x1="580" y1="338" x2="460" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Bottom caption -->
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#2a2a2a" font-weight="500" font-style="italic">The mission orients every feature decision toward one direction.</text>
</svg>
